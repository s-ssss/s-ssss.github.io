<body>

  <header class="site-header">

  <main class="content">
    <h1>留言板</h1>
    <p>随便写点什么，终端会假装接收一下。</p>

    <form onsubmit="event.preventDefault(); alert('演示：静态页暂时不能真的发送，后面可接 Formspree / 后端。');">
      <label for="name">称呼</label>
      <input id="name" type="text" placeholder="输入你的代号" required />

      <label for="message">通讯内容</label>
      <textarea id="message" rows="6" placeholder="输入要发送的信息..." required></textarea>

      <label for="contact">回执地址，选填</label>
      <input id="contact" type="text" placeholder="微信 / 邮箱 / 其他" />

      <button type="submit" class="btn" style="margin-top:18px;">发送</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>// END OF LOG · guestbook</p>
  </footer>

</body>
