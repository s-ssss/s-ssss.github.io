</head>
<body>

<div class="bg-grid"></div>

<header class="topbar">
    <div class="topbar-left">
        <span class="dot"></span>
        <span>MODULE://photo_wall</span>
        <span class="sep">|</span>
        <span>影像数据库</span>
    </div>
    <div class="topbar-right">
        <span>ACCESS // GRANTED</span>
    </div>
</header>

<main class="page-layout">
    <aside class="page-sidebar">
        <div class="side-title">// NAV</div>
        <a href="index.html" class="side-btn"><span class="side-icon">◆</span><span>首页</span></a>
        <a href="plog.html" class="side-btn active"><span class="side-icon">📷</span><span>相片墙</span></a>
        <a href="workshop.html" class="side-btn"><span class="side-icon">⚙</span><span>代码工坊</span></a>
        <a href="guestbook.html" class="side-btn"><span class="side-icon">✍</span><span>留言板</span></a>
    </aside>

    <section class="page-content">
        <h1 class="page-title">📷 相片墙</h1>
        <div id="photoWall"></div>
    </section>
</main>

<div id="lightbox" class="hidden">
    <span id="closeBtn">&times;</span>
    <img id="lightboxImg" src="" alt="">
    <div id="lightboxCaption"></div>
</div>

<footer class="bottombar">
    <span>// END OF LOG · 第七号样本终端 v0.7</span>
    <span class="sep">|</span>
    <span>慢慢来，比较快</span>
</footer>

<script src="data.js"></script>
<script>
    const wall = document.getElementById('photoWall');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');

    const groups = {};
    photos.forEach(p => { if (!groups[p.date]) groups[p.date] = []; groups[p.date].push(p); });

    Object.keys(groups).sort((a,b) => b.localeCompare(a)).forEach(date => {
        const group = document.createElement('div');
        group.className = 'date-group';
        group.innerHTML = `<h2>▷ DATE: ${date}</h2>`;
        const grid = document.createElement('div');
        grid.className = 'grid';
        groups[date].forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${p.src}" alt="${p.title}" loading="lazy"><div class="info"><h3>${p.title}</h3><p>${p.tag}</p></div>`;
            card.onclick = () => { lightboxImg.src = p.src; lightboxCaption.textContent = `▷ ${p.title} · ${p.date}`; lightbox.classList.remove('hidden'); };
            grid.appendChild(card);
        });
        group.appendChild(grid);
        wall.appendChild(group);
    });

    document.getElementById('closeBtn').onclick = () => lightbox.classList.add('hidden');
    lightbox.onclick = (e) => { if(e.target === lightbox) lightbox.classList.add('hidden'); };
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') lightbox.classList.add('hidden'); });
</script>

</body>
</html>
