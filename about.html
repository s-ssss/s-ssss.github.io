<!DOCTYPE html>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="preloader"><div class="preloader-inner"><span>R</span><span>E</span><span>D</span><span>C</span><span>A</span><span>T</span></div></div>

<header class="site-header">
    <div class="header-inner">
        <a href="index.html" class="logo">Red<span>Cat</span></a>
        <nav class="main-nav">
            <a href="index.html">主页</a>
            <a href="portfolio.html">作品</a>
            <a href="about.html" class="active">关于</a>

            <a href="contact.html">联系</a>
        </nav>
        <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
    </div>
</header>

<main class="about-page">
    <div class="page-header">
        <p class="page-tag">ABOUT ME</p>
        <h1>关于我</h1>
    </div>

    <section class="about-grid">
        <div class="about-img">
            <img src="images/about.jpg" alt="关于我" onerror="this.src='https://via.placeholder.com/500x600/2a2a2a/ccc?text=RedCat'">
        </div>
        <div class="about-text">
            <h2>天亮前，烤箱和服务器都在默默工作。</h2>
            <p>开过一家小店，卖自己调的饮品。配方自己调，比例自己试，糖度自己改。现在偶尔在厨房捣鼓新东西，烤箱、奶泡机、温度计，比服务器还多。</p>
            <p>家里有一只柯基，叫多多。照片比我还多。</p>
            <p>能交给机器的，绝不动手指。能跑在云上的，绝不占本地。</p>

            <div class="skill-bars">
                <div class="skill"><span>Rust</span><div class="bar"><div class="fill" style="width:80%"></div></div></div>
                <div class="skill"><span>Python</span><div class="bar"><div class="fill" style="width:100%"></div></div></div>
                <div class="skill"><span>Shell</span><div class="bar"><div class="fill" style="width:80%"></div></div></div>
                <div class="skill"><span>HTML/CSS</span><div class="bar"><div class="fill" style="width:65%"></div></div></div>
            </div>

            <a href="contact.html" class="btn-outline">联系我</a>
        </div>
    </section>
</main>

<footer class="site-footer">
    <div class="footer-left"><span id="copyright3"></span> RedCat · All rights reserved</div>
    <div class="footer-right"><a href="https://github.com/s-ssss" target="_blank">GitHub</a></div>
</footer>

<script>
window.addEventListener('load',()=>{
    document.querySelector('.preloader').style.opacity='0';
    setTimeout(()=>document.querySelector('.preloader').remove(),600);
});
document.getElementById('copyright3').textContent='© '+new Date().getFullYear();
document.getElementById('menuToggle').onclick=()=>{
    document.querySelector('.main-nav').classList.toggle('open');
};
</script>
