<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于我 · RedCat</title>

  <!-- ========== CDN 开关（和 data.js 保持一致） ========== -->
  <script>
    const USE_CDN = true;
    const CDN_BASE = USE_CDN
      ? "https://cdn.jsdelivr.net/gh/s-ssss/s-ssss.github.io@main"
      : "";
  </script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/favicon.png" type="image/png">
</head>

<body>

<!-- ===== Preloader ===== -->
<div class="preloader" id="preloader">
  <div class="preloader-inner"><span>R</span><span>E</span><span>D</span><span>C</span><span>A</span><span>T</span></div>
</div>

<!-- ===== Header ===== -->
<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="index.html" class="logo">Red<span>Cat</span></a>
    <nav class="main-nav" id="mainNav">
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="blog.html">Blog</a>
      <a href="about.html" class="active">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ===== Page Header ===== -->
<section class="page-header">
  <p class="page-tag">About Me</p>
  <h1>你好，我是 RedCat</h1>
</section>

<!-- ===== About Content ===== -->
<section class="about-page">
  <div class="about-grid">

    <!-- 左侧：照片（自动走 CDN） -->
    <div class="about-photo">
      <img id="aboutAvatar" alt="RedCat Avatar">
    </div>

    <!-- 右侧：介绍 -->
    <div class="about-text">
      <h2>记录生活与代码的边角料。</h2>
      <p>
        白天写业务，晚上做饮品，周末遛狗和拍照。
        这个站点用来放一些随手拍的照片、冷萃配方，以及偶尔写点 Rust / Python 的小玩具。
      </p>
      <p>
        站名 RedCat 来自家里那只橘猫（虽然它并不红）。
        如果你对我的脚本、冷萃配方或者照片感兴趣，欢迎随时联系。
      </p>

      <!-- 技能条 -->
      <div class="skill-bars">
        <div class="skill"><span>摄影</span><div class="bar"><div class="fill" style="width:85%"></div></div></div>
        <div class="skill"><span>饮品</span><div class="bar"><div class="fill" style="width:78%"></div></div></div>
        <div class="skill"><span>前端</span><div class="bar"><div class="fill" style="width:90%"></div></div></div>
        <div class="skill"><span>Rust</span><div class="bar"><div class="fill" style="width:65%"></div></div></div>
      </div>

      <a href="contact.html" class="btn-outline">和我聊聊</a>
    </div>

  </div>
</section>

<!-- ===== Footer ===== -->
<footer class="site-footer">
  <span>© 2026 RedCat · Built with ☕ &amp; Code</span>
  <div>
    <a href="https://github.com/s-ssss" target="_blank">GitHub</a>
    <a href="mailto:hello@redcat.studio">Email</a>
  </div>
</footer>

<!-- ===== JS ===== -->
<script>
  /* --- 头像自动拼 CDN --- */
  document.getElementById('aboutAvatar').src =
    (CDN_BASE ? CDN_BASE + '/' : '') + 'images/about.jpg';

  /* --- Preloader --- */
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('preloader').classList.add('hide');
    }, 600);
  });

  /* --- 移动端菜单 --- */
  const toggle = document.getElementById('menuToggle');
  const nav = document.getElementById('mainNav');
  toggle.addEventListener('click', () => nav.classList.toggle('open'));

  /* --- Header 滚动 --- */
  window.addEventListener('scroll', () => {
    document.getElementById('siteHeader')
      .classList.toggle('scrolled', window.scrollY > 60);
  });
</script>

</body>
</html>
