<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedCat | 关于</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 内联防呆：哪怕 style.css 加载失败，preloader 也能正常显示和消失 */
  .preloader{
    position:fixed;inset:0;z-index:9999;
    background:#0a0c10;
    display:flex;justify-content:center;align-items:center;
    transition:opacity .6s ease;
  }
  .preloader-inner{display:flex;gap:6px;}
  .preloader-inner span{
    font-size:44px;font-weight:700;color:#f59e3a;
    opacity:0;transform:translateY(12px);
    animation:fadeUp .6s ease forwards;
  }
  .preloader-inner span:nth-child(1){animation-delay:.0s;}
  .preloader-inner span:nth-child(2){animation-delay:.1s;}
  .preloader-inner span:nth-child(3){animation-delay:.2s;}
  .preloader-inner span:nth-child(4){animation-delay:.3s;}
  .preloader-inner span:nth-child(5){animation-delay:.4s;}
  .preloader-inner span:nth-child(6){animation-delay:.5s;}
  @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<!-- 预加载动画 -->
<div class="preloader" id="preloader">
  <div class="preloader-inner">
    <span>R</span><span>E</span><span>D</span><span>C</span><span>A</span><span>T</span>
  </div>
</div>

<!-- 顶部 -->
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Red<span>Cat</span></a>
    <nav class="main-nav">
      <a href="index.html">主页</a>
      <a href="portfolio.html">作品</a>
      <a href="about.html" class="active">关于</a>
      <a href="blog.html">博客</a>
      <a href="contact.html">联系</a>
    </nav>
    <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
  </div>
</header>

<!-- 内容 -->
<main class="about-page">
  <div class="page-header">
    <p class="page-tag">ABOUT ME</p>
    <h1>关于我</h1>
  </div>

  <section class="about-grid">
    <div class="about-photo">
      <img id="aboutImg" src="images/about.jpg" alt="关于我">
    </div>
    <div class="about-text">
      <h2>天亮前，烤箱和服务器都在默默工作。</h2>
      <p>开过一家小店，卖自己调的饮品。配方自己调，比例自己试，糖度自己改。现在偶尔在厨房捣鼓新东西，烤箱、奶泡机、温度计，比服务器还多。</p>
      <p>家里有一只柯基，叫多多。照片比我还多。</p>
      <p>能交给机器的，绝不动手指。能跑在云上的，绝不占本地。</p>

      <div class="skill-bars">
        <div class="skill"><span>Rust</span><div class="bar"><div class="fill" style="width:80%"></div></div></div>
        <div class="skill"><span>Python</span><div class="bar"><div class="fill" style="width:100%"></div></div></div>
        <div class="skill"><span>Shell</span><div class="bar"><div class="fill" style="width:80%"></div></div></div>
        <div class="skill"><span>HTML/CSS</span><div class="bar"><div class="fill" style="width:65%"></div></div></div>
      </div>

      <a href="contact.html" class="btn-outline">联系我</a>
    </div>
  </section>
</main>

<!-- 页脚 -->
<footer class="site-footer">
  <div class="footer-left"><span id="copyright3"></span> RedCat · All rights reserved</div>
  <div class="footer-right"><a href="https://github.com/s-ssss" target="_blank">GitHub</a></div>
</footer>

<script>
  // 预加载动画：1.2 秒后强制消失
  window.addEventListener('load', () => {
    const pl = document.getElementById('preloader');
    if (!pl) return;
    setTimeout(() => {
      pl.style.opacity = '0';
      setTimeout(() => pl.remove(), 600);
    }, 1200);
  });

  // 头像加载失败兜底
  const aboutImg = document.getElementById('aboutImg');
  aboutImg.onerror = () => {
    aboutImg.style.display = 'none';
    const wrap = document.querySelector('.about-photo');
    wrap.innerHTML = '<div style="width:100%;height:100%;min-height:280px;background:#222;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#888;">头像待上传</div>';
  };

  // 年份
  document.getElementById('copyright3').textContent = '© ' + new Date().getFullYear();

  // 汉堡菜单
  document.getElementById('menuToggle').onclick = () => {
    document.querySelector('.main-nav').classList.toggle('open');
  };
</script>

</body>
</html>
