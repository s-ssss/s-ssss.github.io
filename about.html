<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedCat | 关于</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  margin: 0;
  background: #0a0c10;
  color: #ddd;
  font-family: Arial, "Microsoft YaHei", sans-serif;
}

.site-header {
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.logo {
  color: #f59e3a;
  font-size: 22px;
  text-decoration: none;
  font-weight: bold;
}

.main-nav a {
  color: #ddd;
  text-decoration: none;
  margin-left: 16px;
}

.main-nav a.active,
.main-nav a:hover {
  color: #f59e3a;
}

.about-page {
  max-width: 1120px;
  margin: 40px auto;
  padding: 24px;
}

.page-tag {
  color: #f59e3a;
  letter-spacing: 3px;
  font-size: 13px;
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 40px;
  margin-top: 30px;
}

.about-photo img {
  width: 100%;
  border-radius: 8px;
}

.about-text h2 {
  color: #f59e3a;
}

.about-text p {
  line-height: 1.8;
  color: #bbb;
}

.skill {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 12px 0;
}

.skill span {
  width: 90px;
}

.bar {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,.1);
  border-radius: 4px;
  overflow: hidden;
}

.fill {
  height: 100%;
  background: #f59e3a;
}

.btn-outline {
  display: inline-block;
  margin-top: 20px;
  padding: 10px 24px;
  border: 1px solid #f59e3a;
  color: #f59e3a;
  text-decoration: none;
  border-radius: 4px;
}

.site-footer {
  padding: 20px 24px;
  color: #666;
  font-size: 13px;
  border-top: 1px solid rgba(255,255,255,.08);
  display: flex;
  justify-content: space-between;
  max-width: 1200px;
  margin: 40px auto 0;
}

@media (max-width: 800px) {
  .about-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">RedCat</a>
  <nav class="main-nav">
    <a href="index.html">主页</a>
    <a href="portfolio.html">作品</a>
    <a href="about.html" class="active">关于</a>
    <a href="blog.html">博客</a>
    <a href="contact.html">联系</a>
  </nav>
</header>

<main class="about-page">
  <p class="page-tag">ABOUT ME</p>
  <h1>关于我</h1>

  <section class="about-grid">
    <div class="about-photo">
      <img src="images/about.jpg" alt="RedCat">
    </div>

    <div class="about-text">
      <h2>天亮前，烤箱和服务器都在默默工作。</h2>
      <p>开过一家小店，卖自己调的饮品。配方自己调，比例自己试，糖度自己改。现在偶尔在厨房捣鼓新东西，烤箱、奶泡机、温度计，比服务器还多。</p>
      <p>家里有一只柯基，叫多多。照片比我还多。</p>
      <p>能交给机器的，绝不动手指。能跑在云上的，绝不占本地。</p>

      <div class="skill-bars">
        <div class="skill"><span>Rust</span><div class="bar"><div class="fill" style="width:80%"></div></div></div>
        <div class="skill"><span>Python</span><div class="bar"><div class="fill" style="width:100%"></div></div></div>
        <div class="skill"><span>Shell</span><div class="bar"><div class="fill" style="width:80%"></div></div></div>
        <div class="skill"><span>HTML/CSS</span><div class="bar"><div class="fill" style="width:65%"></div></div></div>
      </div>

      <a href="contact.html" class="btn-outline">联系我</a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div><span id="copyright3"></span> RedCat · All rights reserved</div>
  <div><a href="https://github.com/s-ssss" target="_blank" style="color:#f59e3a;text-decoration:none;">GitHub</a></div>
</footer>

<script>
  document.getElementById('copyright3').textContent = '© ' + new Date().getFullYear();
</script>

</body>
</html>
