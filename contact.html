<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedCat | 联系</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="preloader"><div class="preloader-inner"><span>R</span><span>E</span><span>D</span><span>C</span><span>A</span><span>T</span></div></div>

<header class="site-header">
    <div class="header-inner">
        <a href="index.html" class="logo">Red<span>Cat</span></a>
        <nav class="main-nav">
            <a href="index.html">主页</a>
            <a href="portfolio.html">作品</a>
            <a href="about.html">关于</a>
            <a href="blog.html">博客</a>
            <a href="contact.html" class="active">联系</a>
        </nav>
        <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
    </div>
</header>

<main class="contact-page">
    <div class="page-header">
        <p class="page-tag">CONTACT</p>
        <h1>联系我</h1>
        <p class="page-desc">随便写点什么，终端会转发到我的微信。</p>
    </div>

    <div class="contact-wrap">
        <div class="contact-info">
            <h3>联系方式</h3>
            <p><strong>GitHub:</strong> @s-ssss</p>
            <p><strong>微信:</strong> 随缘（留言板最稳）</p>
            <p><strong>邮箱:</strong> 留言板留一下</p>

            <h3 style="margin-top:30px;">可复制数据</h3>
            <div class="copy-list">
                <div class="copy-item" data-copy="海盐芝士茉莉 — 茶底冷萃6小时，奶盖撒海盐">🧊 海盐芝士茉莉</div>
                <div class="copy-item" data-copy="桂花酒酿拿铁 — 冬天限定，酒酿自己酿">🌼 桂花酒酿拿铁</div>
                <div class="copy-item" data-copy="薄荷青柠气泡 — 夏天一口气喝两杯">🌿 薄荷青柠气泡</div>
                <div class="copy-item" data-copy="代码是写给人看的，顺便能跑就行。饭是做给人吃的，顺便拍个照。">💻 签名档</div>
            </div>
        </div>

        <form class="contact-form" id="guestForm">
            <label>称呼</label>
            <input type="text" id="name" placeholder="输入你的代号" required>

            <label>通讯内容</label>
            <textarea id="message" rows="6" placeholder="想说什么都可以..." required></textarea>

            <label>回执地址（选填）</label>
            <input type="text" id="contact" placeholder="微信 / 邮箱">

            <button type="submit" class="btn-solid">发送讯息</button>
        </form>
        <div id="result" class="hidden"></div>
    </div>
</main>

<footer class="site-footer">
    <div class="footer-left"><span id="copyright5"></span> RedCat · All rights reserved</div>
    <div class="footer-right"><a href="https://github.com/s-ssss" target="_blank">GitHub</a></div>
</footer>

<script>
window.addEventListener('load',()=>{
    document.querySelector('.preloader').style.opacity='0';
    setTimeout(()=>document.querySelector('.preloader').remove(),600);
});

// 复制
document.querySelectorAll('.copy-item').forEach(item=>{
    item.addEventListener('click',async()=>{
        try{
            await navigator.clipboard.writeText(item.dataset.copy);
            const o=item.textContent; item.textContent='✓ 已复制';
            setTimeout(()=>item.textContent=o,1200);
        }catch{}
    });
});

// Server酱推送
const SEND_KEY="SCTxxxxxx"; // ← 换成你的真实 SendKey
const form=document.getElementById('guestForm');
const result=document.getElementById('result');
form.addEventListener('submit',async e=>{
    e.preventDefault();
    const name=document.getElementById('name').value.trim();
    const message=document.getElementById('message').value.trim();
    const contact=document.getElementById('contact').value.trim();
    const title=encodeURIComponent(`RedCat 新讯息 - ${name}`);
    const desp=encodeURIComponent(`通讯内容：${message}\n\n回执地址：${contact||'未提供'}`);
    const url=`https://sctapi.ftqq.com/${SEND_KEY}.send?title=${title}&desp=${desp}`;
    try{
        const res=await fetch(url); const data=await res.json();
        result.className=data.code===0?'success':'error';
        result.textContent=data.code===0?'✓ 发送成功！我会尽快回复。':'✗ 发送失败，请重试。';
        if(data.code===0) form.reset();
    }catch{
        result.className='error';
        result.textContent='✗ 网络异常，请稍后重试。';
    }
    result.classList.remove('hidden');
});

document.getElementById('copyright5').textContent='© '+new Date().getFullYear();
document.getElementById('menuToggle').onclick=()=>{
    document.querySelector('.main-nav').classList.toggle('open');
};
</script>

</body>
</html>
