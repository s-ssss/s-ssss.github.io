<script>
const track = document.getElementById('track');
const reel = document.getElementById('reel');
const wall = document.querySelector('.wallpaper');
let pos = 0, target = 0, maxPos = 0;

function calcMax(){
  maxPos = Math.max(0, track.scrollWidth - window.innerWidth);
}
calcMax();
window.addEventListener('resize', calcMax);

// 滚轮横向
reel.addEventListener('wheel', e => {
  e.preventDefault();
  target += (e.deltaY + e.deltaX) * 0.6;
  target = Math.min(maxPos, Math.max(0, target));
}, {passive:false});

// 拖拽
let dragging=false, startX=0, startTarget=0;
reel.addEventListener('pointerdown', e=>{
  dragging=true; startX=e.clientX; startTarget=target;
  reel.setPointerCapture(e.pointerId);
});
reel.addEventListener('pointermove', e=>{
  if(!dragging) return;
  target = Math.min(maxPos, Math.max(0, startTarget - (e.clientX-startX)*1.4));
});
reel.addEventListener('pointerup', ()=>dragging=false);
reel.addEventListener('pointerleave', ()=>dragging=false);

// 平滑
