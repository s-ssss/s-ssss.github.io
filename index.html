<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>s-ssss 样本终端 · 简版站</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">s-ssss / 样本终端</div>

      <nav>
        <a href="index.html" class="active">首页</a>
        <a href="plog.html">相片墙</a>
        <a href="workshop.html">代码工坊</a>
        <a href="guestbook.html">留言板</a>
      </nav>

      <div class="search-box">
        <input type="text" placeholder="搜索..." />
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-text">
      <p class="tag">// SAMPLE TERMINAL</p>
      <h1>第七号样本</h1>
      <p class="desc">
        这里放一些照片、代码、留言和可复制的小数据。
        风格换简单一点，先保证能看、能用、不乱。
      </p>
      <div class="hero-links">
        <a class="btn" href="guestbook.html">去留言</a>
        <a class="btn ghost" href="plog.html">看相片墙</a>
      </div>
    </div>
  </section>

  <main class="content">

    <section class="cards">

      <article class="card">
        <div class="card-img img-1"></div>
        <div class="card-body">
          <h3>相片墙</h3>
          <p>放照片、截图、日常记录的地方。</p>
          <a href="plog.html">打开 →</a>
        </div>
      </article>

      <article class="card">
        <div class="card-img img-2"></div>
        <div class="card-body">
          <h3>代码工坊</h3>
          <p>一些自动脚本、小工具和实验项目。</p>
          <a href="workshop.html">打开 →</a>
        </div>
      </article>

      <article class="card">
        <div class="card-img img-3"></div>
        <div class="card-body">
          <h3>留言板</h3>
          <p>外部通讯信道，随便写点什么。</p>
          <a href="guestbook.html">打开 →</a>
        </div>
      </article>

    </section>

    <section class="copy-section">
      <h2>可复制数据</h2>
      <p class="sub">点一下就能复制。</p>

      <div class="copy-list">
        <div class="copy-item" data-copy="海盐芝士茉莉">🧊 海盐芝士茉莉</div>
        <div class="copy-item" data-copy="桂花酒酿拿铁">🍶 桂花酒酿拿铁</div>
        <div class="copy-item" data-copy="薄荷青柠气泡">🍃 薄荷青柠气泡</div>
        <div class="copy-item" data-copy="签名档：第七号样本终端">📄 签名档</div>
      </div>

      <p id="copy-tip" class="copy-tip">等待复制...</p>
    </section>

  </main>

  <footer class="site-footer">
    <p>// END OF LOG · s-ssss.github.io · 2026</p>
  </footer>

  <script>
    const items = document.querySelectorAll(".copy-item");
    const tip = document.getElementById("copy-tip");

    items.forEach(item => {
      item.addEventListener("click", () => {
        const text = item.getAttribute("data-copy");

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(() => {
            tip.textContent = "已复制：" + text;
          }).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      });
    });

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        tip.textContent = "已复制：" + text;
      } catch {
        tip.textContent = "复制失败，请手动选择文本";
      }
      document.body.removeChild(ta);
    }
  </script>

</body>
</html>
